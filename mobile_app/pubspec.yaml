name: resq_ai
description: ResQ AI - Intelligent Emergency Detection and Assistance System
publish_to: 'none'
version: 1.0.0+1

environment:
  # Dart 3.6+ required: the codebase uses Color.withValues(alpha:) (Flutter
  # 3.27+) throughout. A lower floor here breaks `flutter pub get` on older
  # toolchains with confusing resolution errors.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sensors_plus: ^6.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  http: ^1.1.0
  provider: ^6.1.1
  uuid: ^4.2.1
  intl: ^0.18.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
