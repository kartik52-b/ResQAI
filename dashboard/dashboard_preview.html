<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ AI — Responder Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
/* ResQ AI Responder Dashboard - Dark Theme */

:root {
    --bg-primary: #0f1117;
    --bg-secondary: #1a1d27;
    --bg-card: #222632;
    --bg-hover: #2a2e3d;
    --text-primary: #e8eaed;
    --text-secondary: #9aa0a6;
    --accent-red: #ef4444;
    --accent-orange: #f59e0b;
    --accent-yellow: #eab308;
    --accent-green: #22c55e;
    --accent-blue: #3b82f6;
    --border-color: #333845;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
}

.header-left h1 {
    font-size: 22px;
    font-weight: 700;
}

.subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-left: 12px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.status-dot.online { background: var(--accent-green); }
.status-dot.offline { background: var(--accent-red); }

.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.btn-secondary:hover {
    background: var(--bg-hover);
}

/* Summary Bar */
.summary-bar {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    overflow-x: auto;
}

.summary-card {
    flex: 1;
    min-width: 120px;
    background: var(--bg-card);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    border: 1px solid var(--border-color);
}

.summary-number {
    display: block;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
}

.summary-label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.summary-card.critical .summary-number { color: var(--accent-red); }
.summary-card.high .summary-number { color: var(--accent-orange); }
.summary-card.medium .summary-number { color: var(--accent-yellow); }
.summary-card.low .summary-number { color: var(--accent-green); }
.summary-card.total .summary-number { color: var(--accent-blue); }

/* Main Content */
.content-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    height: calc(100vh - 170px);
}

.panel {
    padding: 20px;
    overflow-y: auto;
}

.panel h2 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Incident List */
.incident-list-panel {
    border-right: 1px solid var(--border-color);
    background: var(--bg-secondary);
}

.incident-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.incident-card {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
}

.incident-card:hover {
    background: var(--bg-hover);
    border-color: var(--accent-blue);
}

.incident-card.selected {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 1px var(--accent-blue);
}

.incident-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.incident-id {
    font-weight: 700;
    font-size: 15px;
}

.severity-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.severity-CRITICAL { background: rgba(239,68,68,0.2); color: var(--accent-red); }
.severity-HIGH { background: rgba(245,158,11,0.2); color: var(--accent-orange); }
.severity-MEDIUM { background: rgba(234,179,8,0.2); color: var(--accent-yellow); }
.severity-LOW { background: rgba(34,197,94,0.2); color: var(--accent-green); }

.incident-meta {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
}

.incident-score {
    font-weight: 600;
    color: var(--accent-orange);
}

/* Detail Panel */
.detail-panel {
    background: var(--bg-primary);
}

.incident-detail {
    margin-bottom: 16px;
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

.detail-item {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 14px;
}

.detail-item label {
    display: block;
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.detail-item .value {
    font-size: 20px;
    font-weight: 700;
}

.detail-item .value.red { color: var(--accent-red); }
.detail-item .value.orange { color: var(--accent-orange); }
.detail-item .value.green { color: var(--accent-green); }
.detail-item .value.blue { color: var(--accent-blue); }

/* Map */
.map-container {
    height: 350px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid var(--border-color);
}

/* Timeline */
.timeline-section h3 {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.timeline {
    position: relative;
    padding-left: 24px;
}

.timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border-color);
}

.timeline-item {
    position: relative;
    padding: 8px 0 16px 16px;
}

.timeline-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-blue);
    border: 2px solid var(--bg-primary);
}

.timeline-item.critical::before { background: var(--accent-red); }
.timeline-item.high::before { background: var(--accent-orange); }
.timeline-item.medium::before { background: var(--accent-yellow); }
.timeline-item.low::before { background: var(--accent-green); }

.timeline-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: monospace;
}

.timeline-desc {
    font-size: 14px;
    margin-top: 2px;
}

/* Empty State */
.empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px;
    font-size: 14px;
}

/* Responsive */
@media (max-width: 900px) {
    .content-grid {
        grid-template-columns: 1fr;
        height: auto;
    }

    .incident-list-panel {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        max-height: 300px;
    }
}
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🛡️ RESQ AI</h1>
            <span class="subtitle">Responder Dashboard</span>
        </div>
        <div class="header-right">
            <span id="connection-status" class="status-dot offline"></span>
            <span id="status-text">Connecting...</span>
            <button id="refresh-btn" class="btn btn-secondary" onclick="Dashboard.refresh()">↻ Refresh</button>
        </div>
    </header>

    <main>
        <!-- Active Emergencies Summary -->
        <section class="summary-bar">
            <div class="summary-card critical">
                <span class="summary-number" id="critical-count">0</span>
                <span class="summary-label">Critical</span>
            </div>
            <div class="summary-card high">
                <span class="summary-number" id="high-count">0</span>
                <span class="summary-label">High</span>
            </div>
            <div class="summary-card medium">
                <span class="summary-number" id="medium-count">0</span>
                <span class="summary-label">Medium</span>
            </div>
            <div class="summary-card low">
                <span class="summary-number" id="low-count">0</span>
                <span class="summary-label">Low</span>
            </div>
            <div class="summary-card total">
                <span class="summary-number" id="total-count">0</span>
                <span class="summary-label">Total</span>
            </div>
        </section>

        <div class="content-grid">
            <!-- Incident List -->
            <section class="panel incident-list-panel">
                <h2>Active Emergencies</h2>
                <div id="incident-list" class="incident-list">
                    <div class="empty-state">No active emergencies</div>
                </div>
            </section>

            <!-- Incident Details + Map -->
            <section class="panel detail-panel">
                <h2>Incident Details</h2>
                <div id="incident-detail" class="incident-detail">
                    <div class="empty-state">Select an incident to view details</div>
                </div>

                <div id="map" class="map-container"></div>

                <!-- Timeline -->
                <div id="timeline-section" class="timeline-section" style="display:none;">
                    <h3>Incident Timeline</h3>
                    <div id="timeline" class="timeline"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
/**
 * ResQ AI Responder Dashboard
 * Fetches incidents from backend and displays them with map and timeline.
 */

const API_BASE = 'http://localhost:8000';
let map = null;
let markers = [];
let selectedIncident = null;

const Dashboard = {
    init() {
        this.initMap();
        this.refresh();
        // Auto-refresh every 10 seconds
        setInterval(() => this.refresh(), 10000);
    },

    initMap() {
        map = L.map('map').setView([20.5937, 78.9629], 5); // Center on India
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        // Force map to recalculate size
        setTimeout(() => map.invalidateSize(), 100);
    },

    async refresh() {
        try {
            const response = await fetch(`${API_BASE}/incidents`);
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            this.updateConnectionStatus(true);
            this._allIncidents = data.incidents || [];
            this.renderIncidents(this._allIncidents);
            this.updateSummary(this._allIncidents);
        } catch (err) {
            console.error('Refresh failed:', err);
            this.updateConnectionStatus(false);
            // Load demo data if backend is unavailable
            this.loadDemoData();
        }
    },

    updateConnectionStatus(connected) {
        const dot = document.getElementById('connection-status');
        const text = document.getElementById('status-text');
        if (connected) {
            dot.className = 'status-dot online';
            text.textContent = 'Connected';
        } else {
            dot.className = 'status-dot offline';
            text.textContent = 'Demo Mode';
        }
    },

    updateSummary(incidents) {
        let critical = 0, high = 0, medium = 0, low = 0;
        incidents.forEach(inc => {
            switch (inc.severity) {
                case 'CRITICAL': critical++; break;
                case 'HIGH': high++; break;
                case 'MEDIUM': medium++; break;
                case 'LOW': low++; break;
            }
        });
        document.getElementById('critical-count').textContent = critical;
        document.getElementById('high-count').textContent = high;
        document.getElementById('medium-count').textContent = medium;
        document.getElementById('low-count').textContent = low;
        document.getElementById('total-count').textContent = incidents.length;
    },

    renderIncidents(incidents) {
        const list = document.getElementById('incident-list');
        if (!incidents.length) {
            list.innerHTML = '<div class="empty-state">No active emergencies</div>';
            return;
        }

        // Clear old markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        list.innerHTML = incidents.map(inc => {
            const time = new Date(inc.time).toLocaleTimeString();
            return `
                <div class="incident-card" onclick="Dashboard.selectIncident('${inc.incident_id}')" data-id="${inc.incident_id}">
                    <div class="incident-card-header">
                        <span class="incident-id">#${inc.incident_id}</span>
                        <span class="severity-badge severity-${inc.severity}">${inc.severity}</span>
                    </div>
                    <div class="incident-meta">
                        <span>⏱ ${time}</span>
                        <span class="incident-score">Score: ${inc.emergency_score}</span>
                        <span>🚗 ${inc.speed_kmh.toFixed(1)} km/h</span>
                    </div>
                </div>
            `;
        }).join('');

        // Add map markers
        incidents.forEach(inc => {
            if (inc.location && inc.location.latitude && inc.location.longitude) {
                const color = this.getSeverityColor(inc.severity);
                const marker = L.circleMarker(
                    [inc.location.latitude, inc.location.longitude],
                    {
                        radius: 10,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.8,
                    }
                ).addTo(map);
                marker.bindPopup(`
                    <b>#${inc.incident_id}</b><br>
                    Severity: ${inc.severity}<br>
                    Score: ${inc.emergency_score}<br>
                    Speed: ${inc.speed_kmh.toFixed(1)} km/h
                `);
                markers.push(marker);
            }
        });

        // Fit bounds if we have markers
        if (markers.length > 0) {
            const group = L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.3));
        }
    },

    selectIncident(incidentId) {
        // Highlight card
        document.querySelectorAll('.incident-card').forEach(c => c.classList.remove('selected'));
        const card = document.querySelector(`[data-id="${incidentId}"]`);
        if (card) card.classList.add('selected');

        // Find incident data
        const incident = this._allIncidents.find(i => i.incident_id === incidentId);
        if (!incident) return;

        selectedIncident = incident;
        this.renderDetail(incident);
    },

    renderDetail(inc) {
        const detail = document.getElementById('incident-detail');
        const time = new Date(inc.time).toLocaleString();

        detail.innerHTML = `
            <div class="detail-grid">
                <div class="detail-item">
                    <label>Incident ID</label>
                    <div class="value blue">#${inc.incident_id}</div>
                </div>
                <div class="detail-item">
                    <label>Severity</label>
                    <div class="value ${this.getSeverityColorClass(inc.severity)}">${inc.severity}</div>
                </div>
                <div class="detail-item">
                    <label>Emergency Score</label>
                    <div class="value orange">${inc.emergency_score} / 100</div>
                </div>
                <div class="detail-item">
                    <label>Status</label>
                    <div class="value">${inc.status}</div>
                </div>
                <div class="detail-item">
                    <label>Speed</label>
                    <div class="value">${inc.speed_kmh.toFixed(1)} km/h</div>
                </div>
                <div class="detail-item">
                    <label>Impact</label>
                    <div class="value">${inc.impact_magnitude.toFixed(1)} m/s²</div>
                </div>
                <div class="detail-item">
                    <label>Location</label>
                    <div class="value" style="font-size:14px">
                        ${inc.location.latitude.toFixed(5)}, ${inc.location.longitude.toFixed(5)}
                    </div>
                </div>
                <div class="detail-item">
                    <label>Time</label>
                    <div class="value" style="font-size:14px">${time}</div>
                </div>
            </div>
        `;

        // Render timeline
        if (inc.timeline && inc.timeline.length > 0) {
            const timelineSection = document.getElementById('timeline-section');
            const timeline = document.getElementById('timeline');
            timelineSection.style.display = 'block';

            timeline.innerHTML = inc.timeline.map(entry => {
                const severity = entry.score > 70 ? 'critical' :
                    entry.score > 50 ? 'high' :
                    entry.score > 30 ? 'medium' : 'low';
                return `
                    <div class="timeline-item ${severity}">
                        <div class="timeline-time">${entry.timestamp}</div>
                        <div class="timeline-desc">${entry.description}</div>
                    </div>
                `;
            }).join('');
        }

        // Pan map to location
        if (inc.location && inc.location.latitude && inc.location.longitude) {
            map.setView([inc.location.latitude, inc.location.longitude], 14);
        }
    },

    getSeverityColor(severity) {
        switch (severity) {
            case 'CRITICAL': return '#ef4444';
            case 'HIGH': return '#f59e0b';
            case 'MEDIUM': return '#eab308';
            case 'LOW': return '#22c55e';
            default: return '#3b82f6';
        }
    },

    getSeverityColorClass(severity) {
        switch (severity) {
            case 'CRITICAL': return 'red';
            case 'HIGH': return 'orange';
            case 'MEDIUM': return 'orange';
            case 'LOW': return 'green';
            default: return 'blue';
        }
    },

    loadDemoData() {
        const demoIncidents = [
            {
                incident_id: 'DEMO001',
                location: { latitude: 28.6139, longitude: 77.2090 },
                time: new Date(Date.now() - 300000).toISOString(),
                speed_kmh: 45.0,
                impact_magnitude: 52.3,
                emergency_score: 85,
                severity: 'CRITICAL',
                status: 'CONFIRMED',
                timeline: [
                    { timestamp: '10:42:00', description: 'Normal movement', activity_type: 'walking', score: 5 },
                    { timestamp: '10:43:00', description: 'Movement detected', activity_type: 'normal', score: 10 },
                    { timestamp: '10:44:00', description: 'Speed increased', activity_type: 'driving', score: 25 },
                    { timestamp: '10:44:08', description: 'HIGH IMPACT detected', activity_type: 'emergency', score: 85 },
                    { timestamp: '10:44:12', description: 'Sudden stop', activity_type: 'emergency', score: 90 },
                    { timestamp: '10:44:40', description: 'No movement (possible unconsciousness)', activity_type: 'emergency', score: 95 },
                ],
            },
            {
                incident_id: 'DEMO002',
                location: { latitude: 19.0760, longitude: 72.8777 },
                time: new Date(Date.now() - 600000).toISOString(),
                speed_kmh: 60.0,
                impact_magnitude: 38.1,
                emergency_score: 72,
                severity: 'HIGH',
                status: 'CONFIRMED',
                timeline: [
                    { timestamp: '09:15:00', description: 'Driving at normal speed', activity_type: 'driving', score: 10 },
                    { timestamp: '09:16:30', description: 'Speed increased', activity_type: 'driving', score: 20 },
                    { timestamp: '09:17:00', description: 'High impact', activity_type: 'emergency', score: 72 },
                    { timestamp: '09:17:10', description: 'Sudden deceleration', activity_type: 'emergency', score: 78 },
                ],
            },
            {
                incident_id: 'DEMO003',
                location: { latitude: 12.9716, longitude: 77.5946 },
                time: new Date(Date.now() - 900000).toISOString(),
                speed_kmh: 25.0,
                impact_magnitude: 22.0,
                emergency_score: 45,
                severity: 'MEDIUM',
                status: 'DETECTED',
                timeline: [
                    { timestamp: '14:30:00', description: 'Cycling detected', activity_type: 'cycling', score: 8 },
                    { timestamp: '14:31:00', description: 'Unusual movement', activity_type: 'suspicious', score: 45 },
                ],
            },
        ];

        this._allIncidents = demoIncidents;
        this.renderIncidents(demoIncidents);
        this.updateSummary(demoIncidents);
    },

    _allIncidents: [],
};

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => Dashboard.init());
    </script>
</body>
</html>
