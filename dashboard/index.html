<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ AI — Responder Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🛡️ RESQ AI</h1>
            <span class="subtitle">Responder Dashboard</span>
        </div>
        <div class="header-right">
            <span id="connection-status" class="status-dot offline"></span>
            <span id="status-text">Connecting...</span>
            <button id="refresh-btn" class="btn btn-secondary" onclick="Dashboard.refresh()">↻ Refresh</button>
        </div>
    </header>

    <main>
        <!-- Active Emergencies Summary -->
        <section class="summary-bar">
            <div class="summary-card critical">
                <span class="summary-number" id="critical-count">0</span>
                <span class="summary-label">Critical</span>
            </div>
            <div class="summary-card high">
                <span class="summary-number" id="high-count">0</span>
                <span class="summary-label">High</span>
            </div>
            <div class="summary-card medium">
                <span class="summary-number" id="medium-count">0</span>
                <span class="summary-label">Medium</span>
            </div>
            <div class="summary-card low">
                <span class="summary-number" id="low-count">0</span>
                <span class="summary-label">Low</span>
            </div>
            <div class="summary-card total">
                <span class="summary-number" id="total-count">0</span>
                <span class="summary-label">Total</span>
            </div>
        </section>

        <div class="content-grid">
            <!-- Incident List -->
            <section class="panel incident-list-panel">
                <h2>Active Emergencies</h2>
                <div id="incident-list" class="incident-list">
                    <div class="empty-state">No active emergencies</div>
                </div>
            </section>

            <!-- Incident Details + Map -->
            <section class="panel detail-panel">
                <h2>Incident Details</h2>
                <div id="incident-detail" class="incident-detail">
                    <div class="empty-state">Select an incident to view details</div>
                </div>

                <div id="map" class="map-container"></div>

                <!-- Timeline -->
                <div id="timeline-section" class="timeline-section" style="display:none;">
                    <h3>Incident Timeline</h3>
                    <div id="timeline" class="timeline"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
